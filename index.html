<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>WhatsApp - Pepiu</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="chat-container">
		<header class="header">
			<h3>Pepiu</h3>
			<span>En línea</span>
		</header>

		<main class="mensajes-zona" id="messages">
			<!-- Ejemplos de burbujas -->
			<div class="burbuja recibido">Hola, ¿cómo estás?</div>
			<div class="burbuja enviado">Bien, gracias. ¿Y tú?</div>
			<div class="burbuja recibido">Todo bien. ¿Listo para el ejercicio?</div>
		</main>

		<footer class="input-zona">
			<input id="inputMessage" type="text" placeholder="Escribe un mensaje" />
			<button id="sendBtn">Enviar</button>
		</footer>
	</div>

	<script src="script.js"></script>
</body>
</html>
